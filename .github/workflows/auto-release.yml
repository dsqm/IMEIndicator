name: auto-release

# 15 天没有推送就自动发布 Release：
#   - 触发条件：距最后一次推送 >= 15 天，且最后一次推送之后还没有发布过
#     （对比最近一次 Release 的 published_at 与最后一次提交时间，避免同一
#     静默期内重复发版）。
#   - 版本号 = 发布日期（tag = vYYYY.MM.DD），exe 里的版本号也是构建当天
#     日期（build.bat 生成），两者天然一致。
#   - 每天 UTC 03:00 检查一次；workflow_dispatch 供手动触发测试。
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maybe-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check 15-day quiet period
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          quiet=$(( (now - last) / 86400 ))
          echo "days since last push: $quiet"
          if [ "$quiet" -lt 15 ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          pub=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
                --jq '.published_at' 2>/dev/null || true)
          if [ -n "$pub" ]; then
            pcts=$(date -d "$pub" +%s)
            if [ "$pcts" -ge "$last" ]; then
              echo "already released after last push -> skip"
              echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.decide.outputs.go == 'true'
        shell: cmd
        run: call build.bat

      - name: Create release
        if: steps.decide.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ver=$(date +%Y.%m.%d)
          tag="v$ver"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "tag $tag already exists, skip"; exit 0
          fi
          gh release create "$tag" "bin/IMEIndicator.exe" \
            -R "$GITHUB_REPOSITORY" \
            --title "IMEIndicator v$ver" \
            --notes "自动发布：距上次推送已超过 15 天。版本号 = 发布日期 $ver"

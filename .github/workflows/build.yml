name: build

# 每次推送都编译；产物作为 artifact 保留，供手动下载验证。
on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # 构建 + 测试 + 打包三步在 composite action 里，三个 workflow 共用一份。
      - uses: ./.github/actions/build-and-package

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: IMEIndicator-${{ github.sha }}
          path: IMEIndicator.zip
          if-no-files-found: error
